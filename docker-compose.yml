services:
  db:
    image: postgres:16-alpine
    container_name: tst_api-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tst_api-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: ${CONNECTION_STRING}
      MessageQueuingSettings__HostName: ${RABBITMQ_HOST}
      MessageQueuingSettings__Port: ${RABBITMQ_PORT}
      MessageQueuingSettings__UserName: ${RABBITMQ_USER}
      MessageQueuingSettings__Password: ${RABBITMQ_PASSWORD}
      MessageQueuingSettings__Exchange: ${RABBITMQ_EXCHANGE}
      MessageQueuingSettings__RoutingKey: ${RABBITMQ_ROUTING_KEY}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data: